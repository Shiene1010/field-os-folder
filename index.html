<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIELD-OS // TESLA EXTREME TELEMETRY</title>
  
  <!-- Web Fonts: Inter for Clean Automotive Geometric Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Space-time Metric Graph Viewport -->
  <canvas id="field-canvas"></canvas>

  <!-- ================= TOP: ULTRA-MINIMAL ACT SELECTOR & TICKER ================= -->
  <header class="top-hud">
    <div class="act-selector">
      <button class="act-btn active" onclick="orchestrator.setAct(1)">[ 01 ]</button>
      <button class="act-btn" onclick="orchestrator.setAct(2)">[ 02 ]</button>
      <button class="act-btn" onclick="orchestrator.setAct(3)">[ 03 ]</button>
      <button class="act-btn" onclick="orchestrator.setAct(4)">[ 04 ]</button>
    </div>
    <div class="telemetry-ticker" id="telemetry-ticker">
      <span class="ticker-dot"></span>
      <span id="ticker-text">FIELD-OS NOMINAL // ACT 01 ACTIVE</span>
    </div>
  </header>

  <!-- ================= BOTTOM-LEFT CLUSTER ================= -->
  <div class="telemetry-cluster cluster-left">
    
    <!-- Gauge 1: Field Tension (Tesla Downforce Style) -->
    <div class="arc-gauge" id="gauge-tension">
      <svg class="arc-svg" viewBox="0 0 140 140">
        <!-- Left Parenthesis Arc -->
        <path class="arc-path arc-left" d="M 45,18 A 58,58 0 0,0 45,122" />
        <!-- Right Parenthesis Arc -->
        <path class="arc-path arc-right" d="M 95,18 A 58,58 0 0,1 95,122" />
      </svg>
      <div class="gauge-content">
        <span class="gauge-label">TENSION</span>
        <span class="gauge-value" id="val-tension">3009</span>
        <span class="gauge-unit">KG</span>
      </div>
    </div>

    <!-- Gauge 2: 3D Attitude Gyroscope Sphere -->
    <div class="gyro-cluster">
      <canvas id="gyro-canvas" width="140" height="140"></canvas>
    </div>

  </div>

  <!-- ================= BOTTOM-RIGHT CLUSTER ================= -->
  <div class="telemetry-cluster cluster-right">

    <!-- Gauge 3: Entropy / Pitch (Tesla Pitch 89.4 Deg Style) -->
    <div class="arc-gauge" id="gauge-pitch">
      <svg class="arc-svg" viewBox="0 0 140 140">
        <path class="arc-path arc-left" d="M 45,18 A 58,58 0 0,0 45,122" />
        <path class="arc-path arc-right" d="M 95,18 A 58,58 0 0,1 95,122" />
      </svg>
      <div class="gauge-content">
        <span class="gauge-label">PITCH</span>
        <span class="gauge-value" id="val-pitch">89.4</span>
        <span class="gauge-unit">DEG</span>
      </div>
    </div>

    <!-- Gauge 4: Geodesic Curvature / Altitude (Tesla Altitude 30.2 Ft Style) -->
    <div class="arc-gauge" id="gauge-curvature">
      <svg class="arc-svg" viewBox="0 0 140 140">
        <path class="arc-path arc-left" d="M 45,18 A 58,58 0 0,0 45,122" />
        <path class="arc-path arc-right" d="M 95,18 A 58,58 0 0,1 95,122" />
      </svg>
      <div class="gauge-content">
        <span class="gauge-label">ALTITUDE</span>
        <span class="gauge-value" id="val-curvature">30.2</span>
        <span class="gauge-unit">FT</span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
