name: Deploy Field-OS from Markdown Specs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Markdown Specs
        uses: actions/checkout@v4

      - name: Extract Code from Markdown Files
        run: |
          echo "Extracting code blocks from Markdown files..."
          awk '/^```html/{f=1;next} /^```/{f=0} f' INDEX_HTML.md > index.html
          awk '/^```css/{f=1;next} /^```/{f=0} f' STYLE_CSS.md > style.css
          awk '/^```javascript/{f=1;next} /^```/{f=0} f' SCRIPT_JS.md > script.js
          
          # 파일 생성 검증
          ls -lh index.html style.css script.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
